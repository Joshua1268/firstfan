# Production on a single VPS: docker compose -f docker-compose.prod.yml up -d --build
# No published port: the server's existing nginx reaches backend and frontend through the
# external PROXY_NETWORK (deploy/nginx/firstfan.conf). No source mount, no dev server.
# The database is external (DATABASE_* in .env); add --profile localdb to run one here.

name: firstfan-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    profiles: [localdb]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firstfan}
      POSTGRES_USER: ${POSTGRES_USER:-firstfan}
      # Not ":?": compose reads this even when the localdb profile is off.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  firstfan-backend:
    build:
      context: ./backend
      target: prod
    image: firstfan-backend:prod
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST manquant dans .env}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME manquant dans .env}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER manquant dans .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD manquant dans .env}
    volumes:
      # Private uploads: never served directly, only through views that check access.
      - media:/app/media
      # Holds the git-ignored provider CA (deploy/db-ca.pem) when the database needs one.
      - ./deploy:/app/deploy:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      # "firstfan-backend" is in ALLOWED_HOSTS, "localhost" is not.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://firstfan-backend:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Prefixed service names: compose registers each name on the shared proxy network,
    # where other stacks may also have a "backend" or "frontend".
    networks: [default, proxy]
    restart: unless-stopped
    logging: *logging

  firstfan-frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    image: firstfan-frontend:prod
    environment:
      API_INTERNAL_URL: http://firstfan-backend:8000
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
      # Docker sets HOSTNAME to the container id, which the Next server would bind to.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      firstfan-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [default, proxy]
    restart: unless-stopped
    logging: *logging

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?PROXY_NETWORK manquant dans .env}

volumes:
  pgdata:
  media:
