name: firstfan

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  firstfan-backend:
    build:
      context: ./backend
      target: ${ENV:-dev}
    image: firstfan-backend:${ENV:-dev}
    env_file: .env
    ports:
      # Loopback only: in prod, the server's nginx goes through the proxy network.
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    volumes:
      # Private uploads: never served directly, only through views that check access.
      - media:/app/media
      # Holds the git-ignored provider CA (deploy/db-ca.pem) when the database needs one.
      - ./deploy:/app/deploy:ro
    healthcheck:
      # "firstfan-backend" must be in ALLOWED_HOSTS, "localhost" need not be.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://firstfan-backend:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Other stacks on the proxy network may also have a "backend".
    networks: [default, proxy]
    restart: unless-stopped
    logging: *logging
    develop:
      watch:
        - path: ./backend
          target: /app
          action: sync
          ignore: [.venv/, media/, staticfiles/]
        - path: ./backend/uv.lock
          action: rebuild

  firstfan-frontend:
    build:
      context: ./frontend
      target: ${ENV:-dev}
      args:
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    image: firstfan-frontend:${ENV:-dev}
    environment:
      API_INTERNAL_URL: http://firstfan-backend:8000
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      firstfan-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [default, proxy]
    restart: unless-stopped
    logging: *logging
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync
          ignore: [node_modules/, .next/, test-results/]
        - path: ./frontend/pnpm-lock.yaml
          action: rebuild

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-web_network}

volumes:
  media:
