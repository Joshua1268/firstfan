services:
  db:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: cadev
      POSTGRES_USER: cadev
      POSTGRES_PASSWORD: cadev
    volumes:
      - cadev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadev -d cadev"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      target: dev
    command: uv run python manage.py runserver 0.0.0.0:8010
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      # The e2e suite logs in and signs up from one IP far more than the real limits allow.
      THROTTLE_LOGIN: 1000/min
      THROTTLE_ANON: 1000/min
    volumes:
      - ./backend:/app
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    command: pnpm dev -H 0.0.0.0
    env_file:
      - path: .env
        required: false
    environment:
      API_INTERNAL_URL: http://backend:8010
      # File events do not cross the macOS volume reliably.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  cadev_pgdata:
