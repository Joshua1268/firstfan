[project]
name = "cadev-backend"
version = "0.1.0"
description = "Backend Django/DRF de la plateforme de test de applications web par des professionnels verifies"
requires-python = ">=3.13"
dependencies = [
    "django==6.1.2",
    "django-pg8000==0.0.5",
    "djangorestframework==3.18.3",
    "groq==1.7.0",
    "gunicorn==26.2.0",
    "httpx==0.28.1",
    "mistralai==3.6.0",
    "pg8000==1.31.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "N"]
