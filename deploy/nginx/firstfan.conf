# FirstFan behind the server's existing nginx container, which must be on PROXY_NETWORK.
# Copy into that container's conf.d, then: nginx -t && nginx -s reload

server {
    listen 80;
    server_name firstfan.jk-labs.tech;

    # Keep the ACME challenge location used by the other sites, for example:
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name firstfan.jk-labs.tech;

    # Standard certbot paths; adjust to where the nginx container sees them.
    ssl_certificate /etc/letsencrypt/live/firstfan.jk-labs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firstfan.jk-labs.tech/privkey.pem;

    # Docker's DNS, queried per request: nginx starts even when FirstFan is down.
    resolver 127.0.0.11 valid=10s;
    set $backend firstfan-backend:8000;
    set $frontend firstfan-frontend:3000;

    # Uploads are capped at 5 MB by Django; this stops larger bodies early.
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Django sets some of these too; hide them so each header is sent once.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Uploads are private: Django serves them only after an access check.
    location /media/ {
        return 404;
    }

    # A proxy_pass with a variable and no path forwards the full original URI.
    location /api/ {
        proxy_pass http://$backend;
    }

    location = /admin {
        proxy_pass http://$backend;
    }

    location /admin/ {
        proxy_pass http://$backend;
    }

    location /static/ {
        proxy_pass http://$backend;
    }

    location = /t.js {
        proxy_pass http://$backend;
    }

    location / {
        proxy_pass http://$frontend;
    }
}
